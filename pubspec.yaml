name: yomutube
description: A service gives transcribed YouTube for You.

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  cloud_firestore: ^5.4.3
  firebase_auth: ^5.3.1
  firebase_core: ^3.6.0
  fluro: ^2.0.5
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown: ^0.7.3
  intl: ^0.19.0
  webview_flutter: ^4.9.0
  youtube_player_iframe: ^5.2.0

dev_dependencies:
  build_runner: ^2.4.13
  dependency_validator: ^4.1.0
  flutter_gen_runner: ^5.4.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  import_sorter: ^4.6.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - web/
